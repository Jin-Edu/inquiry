<style id="theme">:root{
  --ink:#1f2a27; --muted:#62706b; --line:#e3e7e4; --soft:#f6f7f4; --bg:#f6fbf8; --card:#fff;
  --acc:#2e8b57; --acc-d:#1d6a41; --acc-s:#e6f5ec;
  --ok:#1f7a55;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:19px;line-height:1.7;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
a{color:var(--acc-d);text-underline-offset:3px}
h1,h2,h3,h4{line-height:1.3;margin:0}
p{margin:.6em 0}

/* cover */
.cover{background:linear-gradient(160deg,#effaf3 0%,#d9f1e2 60%,#bfe5cf 100%);border-bottom:1px solid #b9dfc8;padding:56px 0 40px}
.cover .tag{display:inline-block;font-size:16px;font-weight:700;color:var(--acc-d);background:#fff;border:1px solid #b9dfc8;border-radius:999px;padding:3px 12px}
.cover h1{font-size:44px;font-weight:900;margin:16px 0 10px;letter-spacing:-.02em}
.cover h1 span{color:var(--acc-d)}
.cover .sum{max-width:720px;color:#2f4a3b;font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:26px}
.kpis div{background:rgba(255,255,255,.75);border:1px solid #b9dfc8;border-radius:14px;padding:14px 16px}
.kpis b{display:block;font-size:33px;font-weight:900;color:var(--acc-d);font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:16px;color:#4f6b5a}

/* 메인 탭 (1. 수업 구성 / 2. 12차시 한눈에 보기 / 3. 차시별 수업) */
.main-tabs-wrap{margin-top:20px;margin-bottom:8px}
.main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:8px}
.mtab{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s}
.mtab i{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc-d);font-style:normal;font-weight:900;font-size:15px;border:1px solid #b9dfc8;flex:none}
.mtab:hover{border-color:var(--acc);color:var(--acc-d)}
.mtab.active{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 8px rgba(46,139,87,.25)}
.mtab.active i{background:#fff;color:var(--acc-d);border-color:#fff}
@media (max-width:820px){.main-tabs{grid-template-columns:1fr}}

/* 메인 패널 탭 전환 */
.main-panel{display:none}
.main-panel.active{display:block}

/* 차시 바로가기 박스 */
.lesson-picker-box{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:18px}
.picker-title{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.picker-title b{font-size:19px;font-weight:900;color:var(--acc-d)}
.picker-title small{font-size:15px;color:var(--muted);font-weight:500}

/* toc = lesson picker */
.toc{margin-top:0;margin-bottom:0}
.toc .unit-label,.toc small{display:none}
.toc .nav{display:flex;flex-wrap:wrap;gap:8px}
.toc .nav button{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;cursor:pointer;width:auto;text-align:left}
.toc .nav button:hover{border-color:var(--acc)}
.toc .nav button b{font-size:16px;font-weight:500;line-height:1.3}
.toc .nav .num{width:20px;height:20px;flex:none;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.toc .nav button.active{background:var(--acc);border-color:var(--acc);color:#fff}
.toc .nav button.active .num{background:#fff;color:var(--acc-d)}
.toc .nav button.active b{font-weight:700}
.toc .nav button:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid #a8dbbd;outline-offset:2px}

/* sections */
.layout{display:block}
main>section{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 32px 26px;margin:22px 0;scroll-margin-top:16px}
.sec-no{position:absolute;top:28px;left:-14px;width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px rgba(29,106,65,.25)}
main h2{font-size:29px;font-weight:900;margin-bottom:12px;letter-spacing:-.01em}
main h3{font-size:20px;font-weight:700;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
.muted{color:var(--muted);font-size:17px}
.key{margin:14px 0 6px;background:var(--acc-s);border-radius:14px;padding:18px 22px;color:#25503a}
.key b{display:block;font-size:24px;font-weight:900;color:var(--acc-d);margin-bottom:6px}

/* key-value */
.info{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ir{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.info dt{background:var(--soft);font-weight:700;padding:10px 14px;font-size:17px;color:#46524e}
.info dd{margin:0;padding:10px 14px}

/* flow */
.flow3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 6px}
.fcol{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fh{font-weight:900;font-size:19px;margin-bottom:8px}
.fh em{font-style:normal;display:inline-block;background:var(--ink);color:#fff;font-size:15px;border-radius:6px;padding:1px 8px;margin-right:8px;vertical-align:2px}
.fcol ol{margin:0;padding-left:20px;font-size:17px}
.fcol li{margin:3px 0}
.stages{list-style:none;counter-reset:s;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stages li{counter-increment:s;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;display:flex;flex-direction:column;gap:2px}
.stages li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.stages b{font-size:17px}
.stages small{color:var(--acc-d);font-weight:700;font-size:15px}

/* overview table */
.scroll{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
.grid{font-size:16px;min-width:900px}
.grid th{background:var(--ink);color:#fff;font-weight:700;text-align:left;padding:9px 10px;font-size:16px;white-space:nowrap}
.grid td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:#f2fbf5}
.grid tr.hl td{background:#f2fbf5}
.grid .cn{font-weight:900;font-size:19px;color:var(--acc-d);text-align:center;font-variant-numeric:tabular-nums}
.grid .concept{font-weight:700;min-width:150px}

/* lesson */
#lesson .head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
#lesson .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#lesson .tag{display:inline-block;font-size:16px;font-weight:700;color:var(--acc-d);background:#fff;border:1px solid #b9dfc8;border-radius:999px;padding:3px 12px}
#lesson .tag.mint{background:var(--acc-s)}
#lesson h2{font-size:29px;font-weight:900;margin:0 0 6px}
#lesson .intro{margin:0;color:var(--muted);font-size:17px}
#lesson .period-count{font-size:16px;font-weight:700;color:var(--acc-d);background:var(--acc-s);border-radius:999px;padding:3px 12px;white-space:nowrap}
#lesson .question{margin:18px 0 14px;background:var(--acc-s);border-radius:14px;padding:16px 22px;color:#25503a;border:0}
#lesson .question small{display:block;font-size:16px;font-weight:700;color:var(--acc-d);margin-bottom:2px;letter-spacing:0}
#lesson .question p{margin:0;font-size:23px;font-weight:900;color:var(--acc-d)}

/* 예시 앱 토글 및 컨테이너 */
.question-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 14px;background:var(--acc-s);border-radius:18px;padding:18px 22px}
.question-wrap .question{margin:0;padding:0;background:none;border-radius:0;flex:1}
.btn-demo-toggle{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--acc);color:var(--acc-d);padding:10px 18px;border-radius:999px;font:inherit;font-size:17px;font-weight:900;cursor:pointer;white-space:nowrap;transition:.2s;box-shadow:0 3px 8px rgba(46,139,87,.15);flex:none}
.btn-demo-toggle:hover{background:var(--acc-s);transform:translateY(-1px)}
.btn-demo-toggle.active{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 10px rgba(29,106,65,.3)}
.btn-demo-toggle .demo-arrow{font-style:normal;font-size:13px;transition:transform .2s;display:inline-block}
.btn-demo-toggle.active .demo-arrow{transform:rotate(180deg)}
.demo-app-container{background:#fffaf0;border:3px dashed #ffb48a;border-radius:28px;padding:22px;margin:0 0 20px;box-shadow:0 8px 0 #ffe3d0;animation:demoSlide .25s ease-out}
@keyframes demoSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.demo-app-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.demo-app-header b{font-family:Jua,"Noto Sans KR",sans-serif;font-size:24px;color:#e8743b;font-weight:400}
.demo-close-btn{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.demo-close-btn:hover{background:var(--soft);color:var(--ink)}

/* 예시 앱 내부 위젯 공통 스타일 */
.mini-box{background:#fff;border:3px solid #ffe3d0;border-radius:24px;padding:18px;margin:8px 0}
.mini-box>p:first-child{background:#fff3bf;border-radius:16px;padding:8px 14px;color:#8a5a00!important;font-weight:700}
.mini-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mini-input{flex:1;min-width:140px;padding:10px 14px;border:3px solid #ffd9c2;border-radius:16px;font:inherit;font-size:17px;background:#fffdf8}
.mini-input:focus{outline:0;border-color:#ff8a5c;box-shadow:0 0 0 4px #ffe3d0}
.mini-btn{font-family:Jua,"Noto Sans KR",sans-serif;font-size:18px;padding:9px 20px;border-radius:999px;border:0;background:#ff8a5c;color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #d9622f;transition:transform .1s,box-shadow .1s}
.mini-btn:hover{filter:brightness(1.06)}
.mini-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9622f}
.mini-btn.alt{background:#fff;color:#e8743b;border:3px solid #ffd0b5;box-shadow:0 4px 0 #ffd0b5;padding:6px 16px}
.mini-list{display:grid;gap:10px;margin-top:12px}
.mini-item{background:#fff8ee;border:2px solid #ffe3c2;border-radius:18px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px}
.mini-item.done{text-decoration:line-through;color:#a89b8c;background:#f3f0ea}
.mini-item input[type=checkbox],.chip input{width:22px;height:22px;accent-color:#ff8a5c;vertical-align:-5px}
.mini-acts{display:flex;gap:6px;align-items:center}
.mini-item .edit-btn{background:#e3efff;border:0;cursor:pointer;font-size:15px;width:30px;height:30px;border-radius:50%}
.mini-item .del-btn{background:#ffe1e6;border:0;color:#d6455d;font-weight:900;cursor:pointer;font-size:15px;width:30px;height:30px;border-radius:50%}
.chip{background:#fff;border:3px solid #ffe3d0;border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:700}
.chip:has(input:checked){background:#fff3bf;border-color:#ffc93c}
.game-canvas-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.game-cv{background:#fff6e8;border:4px solid #ffd0b5;border-radius:22px;box-shadow:0 6px 0 #ffe3d0;cursor:pointer;max-width:100%;touch-action:none}
.btn-demo-toggle{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;border:3px solid #ffb48a;color:#e8743b;box-shadow:0 4px 0 #ffd0b5}
.btn-demo-toggle:hover{background:#fff3e8}
.btn-demo-toggle.active{background:#ff8a5c;border-color:#ff8a5c;color:#fff;box-shadow:0 4px 0 #d9622f}
.mini-btn.dayb{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:7px 14px;border:3px solid transparent}
.mini-btn.alt.dayb{padding:7px 14px}
.mini-btn .dd{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:700;opacity:.9}
.mini-btn.sat{background:#4d8fe8;box-shadow:0 4px 0 #2f6fc2}
.mini-btn.sun{background:#ee5a6f;box-shadow:0 4px 0 #c43c52}
.mini-btn.sat:active{box-shadow:0 1px 0 #2f6fc2}
.mini-btn.sun:active{box-shadow:0 1px 0 #c43c52}
.mini-btn.alt.sat{background:#fff;color:#2f6fc2;border-color:#bcd6fb;box-shadow:0 4px 0 #bcd6fb}
.mini-btn.alt.sun{background:#fff;color:#c43c52;border-color:#ffc4cc;box-shadow:0 4px 0 #ffc4cc}
.p11-tabs{display:flex;gap:10px;margin:2px 0 12px}
.p11-tabs .mini-btn{flex:1;font-size:19px}
.p11-stage{background:linear-gradient(#e8f8ef,#f4fbe8);border:3px solid #cdeedb;border-radius:24px;padding:12px;text-align:center}
.p11-stage.eye{background:linear-gradient(#e0f4ff,#e8fbef);border-color:#bfe6ff}
.p11-svg{width:100%;max-width:560px;height:auto;max-height:290px;display:block;margin:0 auto}
.p11-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.p11-pick .mini-btn{font-size:16px;padding:7px 16px}
.p11-say{background:#fff;border:3px solid #cfe8f7;border-radius:18px;padding:8px 14px;margin:0 auto 10px;max-width:520px}
.p11-say small{display:block;font-weight:900;color:#2f8fd4;font-size:13px}
.p11-say b{font-size:17px}
.p11-chk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.p11-chk label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #d6f0e0;border-radius:16px;padding:8px 12px;cursor:pointer;font-size:16px;line-height:1.45}
.p11-chk li.on label{background:#e9f9ee;border-color:#8fd8ac}
.p11-chk input{width:22px;height:22px;accent-color:#2e8b57;margin-top:2px;flex:none}
.p11-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.p11-ex{background:#fff;border:3px solid #ffe3d0;border-radius:18px;padding:8px 4px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.p11-ex span{font-size:26px}
.p11-ex.on{background:#fff3bf;border-color:#ffc93c}
.p11-course{background:#fff;border:3px solid #cfe8f7;border-radius:20px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;text-align:left}
.p11-bar{height:12px;background:#e1f1ff;border-radius:999px;overflow:hidden;margin-top:10px}
.p11-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc9ff,#3fa4ff);transition:width .3s}
.p11-tip{margin-top:10px;background:#fff3bf;color:#8a5a00;border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px}
@media (max-width:520px){.p11-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes p11Sit{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes p11Spine{0%,100%{stroke:#10b981;stroke-width:4.5;filter:drop-shadow(0 0 2px #10b981)}50%{stroke:#047857;stroke-width:6;filter:drop-shadow(0 0 6px #34d399)}}
@keyframes p11Gaze{to{stroke-dashoffset:-20}}
@keyframes p11Scan{0%{transform:translateY(0);opacity:.9}50%{transform:translateY(170px);opacity:.4}100%{transform:translateY(0);opacity:.9}}
@keyframes p11Stand{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015) translateY(-2px)}}
@keyframes p11Belly{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3) translateY(-2px)}}
@keyframes p11Zzz{0%{transform:translate(0,0) scale(.8);opacity:0}50%{opacity:.9}100%{transform:translate(14px,-18px) scale(1.2);opacity:0}}
@keyframes p11Blink{0%,92%,100%{transform:scaleY(0);opacity:0}95%{transform:scaleY(1);opacity:1}98%{transform:scaleY(0);opacity:0}}
@keyframes p11Blink2{0%,100%{transform:scaleY(0);opacity:0}35%,65%{transform:scaleY(1);opacity:1}}
@keyframes p11Roll{0%{transform:translate(0,0)}20%{transform:translate(0,-15px)}40%{transform:translate(16px,0)}60%{transform:translate(0,15px)}80%{transform:translate(-16px,0)}100%{transform:translate(0,-15px)}}
@keyframes p11Focus{0%,100%{transform:scale(1);filter:drop-shadow(0 0 2px #38bdf8)}50%{transform:scale(.75);filter:drop-shadow(0 0 8px #0284c7)}}
.p11-sit{animation:p11Sit 3.2s ease-in-out infinite;transform-origin:center bottom}
.p11-spine{animation:p11Spine 2.4s ease-in-out infinite}
.p11-gaze{animation:p11Gaze 1.2s linear infinite}
.p11-stand{animation:p11Stand 3.5s ease-in-out infinite;transform-origin:center bottom}
.p11-belly{animation:p11Belly 3.6s ease-in-out infinite;transform-origin:175px 125px}
.p11-z1{animation:p11Zzz 3s ease-out infinite}
.p11-z2{animation:p11Zzz 3s ease-out infinite 1.2s}
.p11-iris{transition:transform .4s cubic-bezier(.25,1,.5,1);transform-origin:0 0}
.p11-iris.roll{animation:p11Roll 2.6s linear infinite}
.p11-iris.focus{animation:p11Focus 2s ease-in-out infinite}
.p11-lid{animation:p11Blink 4s ease-in-out infinite;transform-origin:center}
.p11-lid.fast{animation:p11Blink2 1.2s ease-in-out infinite}
.w9-root{position:relative}
.w9-sect{position:relative;border:3px solid #cfe8f7;border-radius:24px;padding:14px;overflow:hidden;transition:background .7s;background:linear-gradient(#e0f2fe,#eff6ff,#fffbeb)}
.w9-bannerbox{position:absolute;top:8px;left:0;right:0;z-index:50;display:flex;justify-content:center;pointer-events:none;padding:0 12px}

 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()})}
function render(){const x=L[idx];makeNav();
 const tabs=x.tabs||['1교시 · AI 요청문 작성','2교시 · 오류 찾고 고치기','3교시 · 앱 개선·탐구보고서'];
 const step=(n,t)=>'<div class="step-h"><i>'+n+'</i>'+t+'</div>';
 const p1=step('①','영상 보기')+'<div class="pmt"><b>▶️ 영상에서 찾아요</b><p>영상을 보며 역할, 배경과 목적, 화면, 기능과 순서, 지켜야 할 점, 예시, 완성 확인이 어떤 문장인지 찾아요.</p></div>'+step('②','영상대로 AI 요청문 쓰기')+'<div class="pmt"><b>🎯 AI 요청문을 완성해요</b><p>각 칸에 모범 문장이 들어 있어요. 문장은 칼럼마다 최대 12줄까지 추가할 수 있어요.</p></div>'+
  form(x.p1||[['역할',[ROLE]],['배경과 목적',x.ctx],['만들어야 할 화면',x.scr],['기능과 순서',x.task],['지켜야 할 점',x.guard],['예시',x.ex],['완성 확인',[x.done]]],x.p1?'그림 요청문 복사':'완성한 AI 요청문 복사')+'<div class="pmt"><b>확인하기</b><p>'+(x.p1?'역할, 배경과 목적, 그릴 그림, 그리는 순서와 모양, 지킬 점, 예시, 완성 확인 문장이 모두 들어갔나요?':'역할, 배경과 목적, 화면, 기능, 지킬 점, 예시, 완성 확인 문장이 모두 들어갔나요?')+'</p></div>';
 const d=x.dbg,p2=step('①','영상 보기')+'<div class="pmt"><b>▶️ 영상에서 찾아요</b><p>기대한 동작과 실제 동작이 어떻게 다른지, 문제가 생기는 순서는 무엇인지, 한 번에 한 가지씩 고치는 요청은 어떻게 쓰는지 확인해요.</p></div>'+step('②','영상대로 오류 찾고 고치기 쓰기')+'<div class="pmt"><b>🪲 오류를 고치는 요청을 완성해요</b><p>스타레이드를 직접 플레이하며 문제를 찾고, 한 문장씩 입력해요.</p></div>'+
  form([['기대와 실제',[d[0],d[1]]],['문제 재현',[d[2]]],['수정 요청',[d[3],KEEP]],['수정 확인',[VERIFY]]],'수정 요청 복사')+(x.dlist?'<div class="pmt"><b>🧩 자주 생기는 그림 문제</b></div><ul class="sr-list">'+x.dlist.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'');
 const u=x.up,p3=step('①','영상 보기')+'<div class="pmt"><b>▶️ 영상에서 찾아요</b><p>새 기능을 요청하는 방법(추가할 기능, 필요한 까닭과 사용 방법, 지켜야 할 점, 완성 확인)과 탐구보고서 다섯 가지 질문에 답하는 방법을 확인해요.</p></div>'+step('②','영상대로 앱 개선 요청 쓰기')+'<div class="pmt"><b>🚀 앱 개선 요청을 완성해요</b><p>새 기능과 필요한 까닭, 사용 방법을 문장별로 입력해요.</p></div>'+
  form([['추가할 기능',[u[0]]],['필요한 까닭과 사용 방법',[u[1],u[2]]],['지켜야 할 점',[u[3],UPKEEP]],['완성 확인',[u[4]]]],'앱 개선 요청 복사')+
  (x.sheet?'<div class="pmt"><b>🖼 준비할 그림 20장</b><p>게임에 넣을 그림을 하나씩 확인해요.</p></div><ul class="sr-list">'+x.sheet.map(v=>'<li><label><input type="checkbox"> '+esc(v)+'</label></li>').join('')+'</ul>':'')+'<div class="pmt"><b>💡 다른 개선 아이디어</b></div><ul class="sr-list">'+x.ups.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>'+(x.tip?'<div class="pmt"><b>👩‍🏫</b><p>'+esc(x.tip)+'</p></div>':'')+
  step('③','탐구 노트 쓰기')+NOTES.map((q,i)=>'<label class="report-label">'+(i+1)+'. '+esc(q)+'<textarea rows="3" style="width:100%;font:inherit;font-size:17px"></textarea></label>').join('');
 $('lesson').innerHTML='<div class="head"><div><div class="tags"><span class="tag mint">스타레이드 '+x.n+'/7</span><span class="tag">'+esc(x.concept)+'</span><span class="tag">결과물 1개</span></div><h2>'+String(x.n).padStart(2,'0')+'차시 · '+esc(x.title)+'</h2><p class="intro">초등학교 3~4학년 · 앞 차시에서 만든 게임에 기능을 하나씩 더하며 완성해요.</p></div><div class="period-count">3교시</div></div>'+
  '<div class="question-wrap"><div class="question"><small>오늘의 탐구 질문</small><b>'+esc(x.q)+'</b></div></div>'+
  '<div class="tabs">'+tabs.map((t,i)=>'<button class="tab'+(i?'':' on')+'" data-i="'+i+'">'+t+'</button>').join('')+'</div>'+
  [p1,p2,p3].map((h,i)=>'<div class="sr-pane'+(i?'':' on')+'">'+h+'</div>').join('');
 document.querySelectorAll('#lesson .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lesson .tab').forEach(t=>t.classList.toggle('on',t===b));document.querySelectorAll('#lesson .sr-pane').forEach((p,i)=>p.classList.toggle('on',i===+b.dataset.i))})}
document.addEventListener('click',e=>{const b=e.target.closest('.add-line,.remove-line,.copy-student');if(!b)return;
 if(b.classList.contains('copy-student')){copy([...b.closest('form').querySelectorAll('.prompt-group')].map(g=>g.querySelector('h4').textContent+'\n'+[...g.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean).join('\n')).join('\n\n'));return}
 const g=b.closest('.prompt-group'),rows=g.querySelector('.prompt-rows'),n=rows.children.length;
 if(b.classList.contains('add-line')&&n<12)rows.insertAdjacentHTML('beforeend',row(n+1,''));
 if(b.classList.contains('remove-line')&&n>1)rows.lastElementChild.remove();
 const m=rows.children.length;g.querySelector('.add-line').disabled=m>=12;g.querySelector('.remove-line').disabled=m<=1});
render();
</script>
